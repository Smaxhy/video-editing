# ClipForge. The installers (deploy/install-server.sh, deploy/install-windows.ps1) write .env and run this.
# .env holds: CLIPFORGE_PASSWORD, CLAUDE_CODE_OAUTH_TOKEN, and optionally CLIPFORGE_BIND / CLIPFORGE_PORT.
services:
  clipforge:
    build:
      context: .
      args:
        WITH_WHISPERX: ${WITH_WHISPERX:-0}   # set WITH_WHISPERX=1 in .env to include WhisperX
    image: clipforge:latest
    container_name: clipforge
    restart: unless-stopped
    ports:
      # 127.0.0.1 by default: reached through `tailscale serve`, never exposed to the internet.
      # Set CLIPFORGE_BIND=0.0.0.0 in .env to also open it to phones on your home Wi-Fi.
      - "${CLIPFORGE_BIND:-127.0.0.1}:${CLIPFORGE_PORT:-3000}:3000"
    environment:
      CLIPFORGE_PASSWORD: ${CLIPFORGE_PASSWORD:?set CLIPFORGE_PASSWORD in .env}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?run `claude setup-token` and set CLAUDE_CODE_OAUTH_TOKEN in .env}
    volumes:
      - ./uploads:/app/uploads
      - ./workspace:/app/workspace
      - ./output:/app/output
      - model-cache:/root/.cache   # speech / voice / cutout models survive rebuilds
volumes:
  model-cache:
